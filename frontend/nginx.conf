server {
    listen 80;
    server_name localhost;

    # 1. 前端静态资源配置
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 解决 Vue 路由在 history 模式下刷新 404 的问题
        try_files $uri $uri/ /index.html;
    }

    # 2. 后端接口反向代理配置
    # 将 /api 开头的请求转发给后端容器
    location /api/ {
        # 注意：这里的 'backend' 对应下面 docker-compose.yml 中的服务名
        # 端口 8080 对应 application.yml 中的 server.port
        # 使用 rewrite 去掉 /api 前缀，或者利用 proxy_pass 的截断特性（加 trailing slash）
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}